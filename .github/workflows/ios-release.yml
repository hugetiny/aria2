name: ios-release

on:
  push:
    tags:
      - 'release-*'
  workflow_dispatch:
    inputs:
      manual_build:
        description: 'Manually trigger iOS build'
        required: false
        default: 'true'

permissions:
  contents: write

jobs:
  build-ios:
    runs-on: ubuntu-22.04
    
    steps:
    - uses: actions/checkout@v5
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Build iOS binary with Docker
      run: |
        docker build -t aria2-ios -f Dockerfile.ios .
        docker create --name aria2-ios-container aria2-ios
        docker cp aria2-ios-container:/root/build/aria2/src/aria2c ./aria2c-ios-arm64
        docker rm aria2-ios-container
    
    - name: Get version
      id: get_version
      run: |
        if [[ $GITHUB_REF == refs/tags/release-* ]]; then
          VERSION=${GITHUB_REF#refs/tags/release-}
        else
          VERSION=$(grep AC_INIT configure.ac | cut -d'[' -f3 | cut -d']' -f1)
          VERSION="${VERSION}-$(git rev-parse --short HEAD)"
        fi
        echo "version=$VERSION" >> $GITHUB_OUTPUT
    
    - name: Create release archive
      run: |
        VERSION=${{ steps.get_version.outputs.version }}
        DIST_DIR=aria2-${VERSION}-arm64-ios-build1
        mkdir -p ${DIST_DIR}
        cp aria2c-ios-arm64 ${DIST_DIR}/aria2c
        cp AUTHORS COPYING ChangeLog LICENSE.OpenSSL NEWS README.ios ${DIST_DIR}/
        
        # Generate README.html if README.rst exists
        if command -v rst2html &> /dev/null && [ -f README.rst ]; then
          rst2html README.rst ${DIST_DIR}/README.html || cp README.rst ${DIST_DIR}/
        else
          cp README.rst ${DIST_DIR}/ || true
        fi
        
        # Create zip archive
        zip -9 -r ${DIST_DIR}.zip ${DIST_DIR}
        
        # Create checksum
        sha256sum ${DIST_DIR}.zip > ${DIST_DIR}.zip.sha256
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: aria2-ios-arm64
        path: |
          aria2-*-arm64-ios-*.zip
          aria2-*-arm64-ios-*.zip.sha256
        retention-days: 30
    
    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/release-')
      uses: softprops/action-gh-release@v1
      with:
        files: |
          aria2-*-arm64-ios-*.zip
          aria2-*-arm64-ios-*.zip.sha256
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
